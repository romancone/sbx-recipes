name: check

# Proves every recipe builds on both architectures before a release tag. Pushes nothing.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        recipe: [go]
        vendor: [claude-code]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pins
        id: pins
        env:
          RECIPE: ${{ matrix.recipe }}
          VENDOR: ${{ matrix.vendor }}
        run: |
          base="$(sed -n "s|^${VENDOR}=||p" vendors)"
          [[ -n "${base}" ]] || { echo "no vendor '${VENDOR}' in vendors"; exit 1; }
          {
            echo "args<<EOF"
            echo "BASE=${base}"
            cat "${RECIPE}/versions"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.recipe }}
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: ${{ steps.pins.outputs.args }}
